spring:
  application:
    name: banking-system

  # ── Database (PostgreSQL) ───────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${DB_USER:banking}
    password: ${DB_PASS:banking_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: banking-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # ── JPA ─────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true

  # ── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # ── RabbitMQ ────────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:banking}
    password: ${RABBITMQ_PASS:banking_secret}
    virtual-host: /
    connection-timeout: 10000
    listener:
      simple:
        prefetch: 10
        acknowledge-mode: manual

  # ── Redis (Redisson distributed lock) ───────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:redis_secret}
      ssl:
        enabled: ${REDIS_SSL:false}

  # ── Jackson ─────────────────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ── Actuator / Observability ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.banking: INFO
    org.springframework.amqp: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

# ── Application ───────────────────────────────────────────────────────────────
banking:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-in-production-use-a-256-bit-secret-key}
      expiration-ms: 86400000
  distributed-lock:
    default-lease-seconds: 30
  rabbitmq:
    exchange: banking.events
    queues:
      transfer-initiated: banking.transfer.initiated
      account-debited: banking.account.debited
      account-credited: banking.account.credited
      transfer-completed: banking.transfer.completed
      transfer-failed: banking.transfer.failed
      dead-letter: banking.dead-letter

# ── Resilience4j ─────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      transferService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    instances:
      transferService:
        max-attempts: 3
        wait-duration: 100ms
        retry-exceptions:
          - org.springframework.dao.OptimisticLockingFailureException
          - jakarta.persistence.OptimisticLockException
      eventPublisher:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.amqp.AmqpException
