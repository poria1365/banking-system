spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

banking:
  security:
    jwt:
      secret: test-secret-key-that-is-at-least-256-bits-long-for-hmac
      expiration-ms: 86400000
  distributed-lock:
    default-lease-seconds: 30
  rabbitmq:
    exchange: banking.events
    queues:
      transfer-initiated: banking.transfer.initiated
      account-debited: banking.account.debited
      account-credited: banking.account.credited
      transfer-completed: banking.transfer.completed
      transfer-failed: banking.transfer.failed
      dead-letter: banking.dead-letter

logging:
  level:
    com.banking: WARN
    org.hibernate.SQL: WARN
